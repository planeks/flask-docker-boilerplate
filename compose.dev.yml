x-flask-common: &flask-common
  image: "${COMPOSE_PROJECT_NAME}_dev"
  depends_on:
    - postgres
    - redis
    - mailhog
  volumes:
    - ./src:/opt/project/src:cached
    - /opt/project/src/.venv
    - ./data/dev:/data:z
  env_file:
    - ./.env

services:
  flask:
    <<: *flask-common
    build:
      context: .
      dockerfile: ./docker/flask/Dockerfile
      args:
        ENVIRONMENT: development
    ports:
      - "8000:8000"
    command: dev
  celeryworker:
    <<: *flask-common
    depends_on:
      - flask
      - postgres
      - redis
      - mailhog
    command: celery-dev worker -l INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  celerybeat:
    <<: *flask-common
    depends_on:
      - flask
      - postgres
      - redis
      - mailhog
    command: celery-dev beat -l INFO
  flower:
    image: mher/flower:0.9.7
    command: "flower --broker=${REDIS_URL} --port=5555 --url-prefix=flower"
    ports:
      - "5555:5555"
    depends_on:
      celeryworker:
        condition: service_healthy
      celerybeat:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - ./.env
  redis:
    image: redis:6.0
    volumes:
      - dev_redis:/data
  postgres:
    build:
      context: .
      dockerfile: ./docker/postgres/Dockerfile
    image: "${COMPOSE_PROJECT_NAME}_dev_postgres"
    volumes:
      - ./data/dev_postgres:/var/lib/postgresql/data:Z
      - ./data/dev_backups:/backups:z
    env_file:
      - ./.env
  mailhog:
    image: mailhog/mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - "8025:8025" # web ui
  mkdocs:
    build:
      context: .
      dockerfile: ./docker/mkdocs/Dockerfile
    image: "${COMPOSE_PROJECT_NAME}_dev_mkdocs"
    command: serve
    volumes:
      - ./docs:/docs:cached
      - ./data/dev_mkdocs:/data:z
      - ./src:/code/src:cached
    ports:
      - "8050:8000"
    env_file:
      - ./.env
