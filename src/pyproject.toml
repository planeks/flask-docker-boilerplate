[tool.poetry]
name = "flask-docker-boilerplate"
version = "0.1.0"
description = ""
authors = ["Planeks <planeks@planeks.net>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
docutils = "^0.21.2"
celery = "^5.4.0"
celery-redbeat = "^2.2.0"
cffi = "^1.17.1"
gunicorn = "^23.0.0"
markdown = "^3.7"
pillow = "^11.0.0"
psycopg2-binary = "^2.9.10"
pyopenssl = "^24.3.0"
pyparsing = "^3.2.0"
python-decouple = "^3.8"
python-jose = "^3.3.0"
pydot = "^3.0.2"
redis = "^5.2.0"
requests = "^2.32.3"
sentry-sdk = {extras = ["flask"], version = "^2.27.0"}
shortuuid = "^1.0.13"
uvicorn = {extras = ["standard"], version = "^0.32.1"}
watchfiles = "^0.24"
werkzeug = "^3.1.3"
whitenoise = "^6.8.2"
flask = "^3.1.0"
flask-sqlalchemy = "^3.1.1"
flask-migrate = "^4.1.0"
flask-admin = "^1.6.1"
flask-wtf = "^1.2.2"
flask-debugtoolbar = "^0.16.0"
flask-login = "^0.6.3"
flask-caching = "^2.3.1"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
freezegun = "^1.4"
markdown-urlize = "^0.2"
pytest = "^7.4"
ruff = "^0.6.7"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.3"
mkdocs-awesome-pages-plugin = "^2.9.2"
mkdocs-graphviz = "^1.5.3"
mkdocs-material = "^9.5.6"
mkdocstrings = {extras = ["python"], version = "^0.24.0"}
mkdocstrings-python = "^1.9.0"
griffe = "^0.40.0"
pydot = "^3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "migrations",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",     # flake8-annotations (type annotations not enforced)
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)
    "D",       # pydocstyle (docstrings not enforced globally)
    "PT009",   # pytest-unittest-assertion
    "B904",    # raise-without-from-inside-except
    "S101",    # assert (used in tests)
    "ARG001",  # unused-function-argument
    "ARG002",  # unused-method-argument
    "G004",    # logging-f-string
    "EM102",   # f-string-in-exception
    "TRY003",  # raise-vanilla-args
    "TRY401",  # verbose-log-message
    "EM101",   # raw-string-in-exception
    "S311",    # suspicious-non-cryptographic-random-usage
    "S107",    # hardcoded-password-default
    "S105",    # hardcoded-password-string
    "N802",    # invalid-function-name
    "TC001",   # typing-only-first-party-import
    "TC002",   # typing-only-third-party-import
    "PTH",     # flake8-use-pathlib (not enforced globally)
    "RUF012",  # mutable-class-default
    "ERA001",  # commented-out-code (temporary)
]
extend-select = ["I"]
pydocstyle = { convention = "google" }
mccabe = { max-complexity = 14 }
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"config.py" = ["N802", "N815", "S105"]
"test_*.py" = ["S101", "ARG001", "ARG002", "PLR2004"]
"conftest.py" = ["ARG001", "ARG002"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
