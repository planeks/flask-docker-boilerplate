name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      branch:
        description: 'Branch to deploy'
        required: true
        type: string
      compose-file:
        description: 'Docker compose file'
        required: false
        type: string
        default: 'compose.dev.yml'
      project-path:
        description: 'Project path on server'
        required: false
        type: string
        default: '~/projects/flask_app'
    secrets:
      host:
        description: 'Server hostname'
        required: true
      ssh-key:
        description: 'SSH private key'
        required: true
      username:
        description: 'SSH username'
        required: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.username || 'appuser' }}
          key: ${{ secrets.ssh-key }}
          envs: COMPOSE_FILE,BRANCH,PROJECT_PATH
          script: |
            set -e
            export COMPOSE_FILE="${{ inputs.compose-file }}"
            export BRANCH="${{ inputs.branch }}"
            export PROJECT_PATH="${{ inputs.project-path }}"
            export ENVIRONMENT="${{ inputs.environment }}"

            cd "$PROJECT_PATH"
            bash scripts/deploy.sh "$COMPOSE_FILE" "$BRANCH" "$PROJECT_PATH"
