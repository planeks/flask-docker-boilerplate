name: CI

on:
  workflow_call: {}
  pull_request:
    branches: [develop, staging, main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
      - "ansible/**"
      - ".pre-commit-config.yaml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff pip-audit

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff formatter check
        run: ruff format --check src/

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip install poetry
          cd src && poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt

  test-backend:
    name: Test Flask Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-backend]
    if: ${{ github.base_ref != 'develop' && !failure() && !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create test .env file
        run: cp dev.env .env

      - name: Build Docker images
        run: docker compose -f compose.dev.yml build

      - name: Run Flask tests
        run: docker compose -f compose.dev.yml run --rm flask test

      - name: Cleanup
        if: always()
        run: docker compose -f compose.dev.yml down -v
